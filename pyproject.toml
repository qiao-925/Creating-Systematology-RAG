[project]
name = "systematology"
version = "0.1.0"
description = "Creating Systematology - Causal Loop Diagram Analysis Pipeline based on LlamaIndex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.14.3",
    "llama-index-llms-litellm>=0.6.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "llama-index-readers-file>=0.2.0",
    "chromadb>=0.5.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "networkx>=3.0",
    "instructor>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "coverage>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "pytest-asyncio>=0.21.0",
]
evaluation = [
    "ragas>=0.2.0",
]

# ==================== 国内镜像源配置 ====================
# 配置国内 PyPI 镜像源，加速包下载
# 推荐使用清华大学镜像源（稳定、速度快）

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
explicit = false

